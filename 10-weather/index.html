<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Widget — DotWidget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="weather-wrapper">
    <div class="weather-container">
      
      <!-- Current Header Stats -->
      <div class="weather-header">
        <div class="location-info">
          <h2 class="city-name" id="city">VANCOUVER</h2>
          <span class="sub-label">WEATHER</span>
        </div>

        <div class="current-icon-wrapper" id="current-icon">
          🌙
        </div>

        <div class="current-temp-wrapper">
          <div class="temp-val"><span id="temp">18</span>°C</div>
          <div class="weather-desc" id="condition">clear sky</div>
        </div>
      </div>

      <!-- 7-Day Extended Forecast Bar (Hidden on narrow containers) -->
      <div class="forecast-grid" id="forecast">
        <div class="forecast-day">
          <span class="day-name">Wed</span>
          <span class="day-icon">🌙</span>
          <span class="high-temp">24°C</span>
          <span class="low-temp">14°C</span>
        </div>
        <div class="forecast-day">
          <span class="day-name">Thu</span>
          <span class="day-icon">🌙</span>
          <span class="high-temp">24°C</span>
          <span class="low-temp">14°C</span>
        </div>
        <div class="forecast-day">
          <span class="day-name">Fri</span>
          <span class="day-icon">🌙</span>
          <span class="high-temp">23°C</span>
          <span class="low-temp">14°C</span>
        </div>
        <div class="forecast-day">
          <span class="day-name">Sat</span>
          <span class="day-icon">🌙</span>
          <span class="high-temp">22°C</span>
          <span class="low-temp">16°C</span>
        </div>
        <div class="forecast-day">
          <span class="day-name">Sun</span>
          <span class="day-icon">⛅</span>
          <span class="high-temp">20°C</span>
          <span class="low-temp">16°C</span>
        </div>
        <div class="forecast-day">
          <span class="day-name">Mon</span>
          <span class="day-icon">🌤️</span>
          <span class="high-temp">21°C</span>
          <span class="low-temp">15°C</span>
        </div>
        <div class="forecast-day">
          <span class="day-name">Tue</span>
          <span class="day-icon">🌧️</span>
          <span class="high-temp">21°C</span>
          <span class="low-temp">16°C</span>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

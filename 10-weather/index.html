<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather — DotWidget</title>
  
  <link rel="stylesheet" href="../shared/css/variables.css">
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="../shared/css/widget.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <div class="dw-widget weather-container">
      <div class="widget-label">WEATHER</div>

      <!-- Location Input View -->
      <form id="location-form" class="location-form">
        <input type="text" id="city-input" placeholder="Enter city name..." autocomplete="off" required>
        <button type="submit" class="btn-search">Search</button>
      </form>

      <!-- Loading State -->
      <div id="weather-loading" class="weather-loading hidden">
        <span>Fetching weather...</span>
      </div>

      <!-- Weather Display View -->
      <div id="weather-content" class="weather-content hidden">
        <div class="weather-main">
          <div id="weather-icon" class="weather-icon">☀️</div>
          <div class="weather-temp">
            <span id="temp-val">--</span><span class="unit">°C</span>
          </div>
        </div>

        <div class="weather-details">
          <div id="weather-condition" class="condition">Clear Sky</div>
          <div id="weather-location" class="location">City, Country</div>
        </div>

        <div class="weather-stats">
          <div class="stat">
            <span class="stat-label">HUMIDITY</span>
            <span id="stat-humidity" class="stat-val">--%</span>
          </div>
          <div class="stat">
            <span class="stat-label">WIND</span>
            <span id="stat-wind" class="stat-val">-- km/h</span>
          </div>
        </div>

        <button id="btn-change-location" class="btn-change">Change Location</button>
      </div>
    </div>
  </main>

  <script src="../shared/js/theme.js"></script>
  <script src="../shared/js/storage.js"></script>
  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker — DotWidget</title>
  
  <link rel="stylesheet" href="../shared/css/variables.css">
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="../shared/css/widget.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <div class="dw-widget habit-container">
      <div class="widget-label">HABIT TRACKER</div>

      <!-- Add Habit Form -->
      <form id="habit-form" class="habit-form">
        <input type="text" id="habit-input" placeholder="New habit..." maxlength="24" required autocomplete="off">
        <button type="submit" class="btn-add">+</button>
      </form>

      <!-- Habit List -->
      <div class="habits-list-wrapper">
        <ul id="habits-list" class="habits-list"></ul>
      </div>
    </div>
  </main>

  <script src="../shared/js/theme.js"></script>
  <script src="../shared/js/storage.js"></script>
  <script src="script.js"></script>
</body>
</html>
